<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement - StoreFlight</title>

<script src="https://www.paypal.com/sdk/js?client-id=AfUrubsCvRdT7fWJPaNImjSdiW0rKpxIvLO7Js8fwFYJK6tpZYDyqcUUY2u1E6ckodmgBEoy0OVSlzYU&currency=EUR"></script>

<style>
body {
  background: #0b0f15;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  padding: 40px;
}

.card {
  background: #121826;
  padding: 20px;
  border-radius: 10px;
  width: 420px;
  text-align: center;
}

#msg { margin-top: 10px; }
</style>
</head>

<body>

<div class="card">
  <h2>Paiement sécurisé 🔒</h2>

  <div id="summary"></div>

  <br>

  <div id="paypal-button-container"></div>

  <div id="msg"></div>

</div>

<script>
const BACKEND = "https://storeflight-backend-1.onrender.com";

const reservation = JSON.parse(localStorage.getItem("reservation") || "null");

const summary = document.getElementById("summary");
const msg = document.getElementById("msg");

if (!reservation) {
  msg.innerHTML = "❌ Aucune réservation trouvée";
} else {

  summary.innerHTML = `
    <b>${reservation.full_name}</b><br>
    Service: ${reservation.service_type}<br>
    Départ: ${reservation.from_city}<br>
    Destination: ${reservation.to_city}<br>
    Dates: ${reservation.check_in} → ${reservation.check_out}<br>
    Voyageurs: ${reservation.travelers}
  `;

  paypal.Buttons({

    createOrder: async () => {
      const res = await fetch(`${BACKEND}/api/paypal/create-order`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ amount: "15.00", currency: "EUR" })
      });

      const data = await res.json();
      return data.order.id;
    },

    onApprove: async (data) => {
      try {

        msg.innerHTML = "Paiement validé...";

        const payload = {
          full_name: reservation.full_name,
          phone: reservation.phone,
          email: reservation.email,
          service_type: reservation.service_type,
          from_city: reservation.from_city,
          to_city: reservation.to_city,
          check_in: reservation.check_in,
          check_out: reservation.check_out,
          travelers: reservation.travelers,
          notes: reservation.notes,
          paypal_order_id: data.orderID,
          status: "paid"
        };

        const r = await fetch(`${BACKEND}/api/reservations`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });

        const result = await r.json();

        if (result.ok) {
          localStorage.removeItem("reservation");

          msg.innerHTML = "✅ Réservation confirmée !";

          setTimeout(() => {
            window.location.href = "success.html";
          }, 2000);

        } else {
          msg.innerHTML = "❌ Erreur: " + result.error;
        }

      } catch (err) {
        console.error(err);
        msg.innerHTML = "❌ Erreur serveur";
      }
    }

  }).render('#paypal-button-container');
}
</script>

</body>
</html>
